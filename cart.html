<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محلات أبو حطب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; }
    .header-title { color: #103485; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="header-title"><i class="bi bi-cart3 me-2"></i>سلة المشتريات</h2>
      <a href="index.html" class="btn btn-outline-secondary fw-bold">العودة للرئيسية</a>
    </div>

    <div class="card p-4 shadow-sm border-0">
      <div id="cartItemsContainer">
        <p class="text-center text-muted my-4">السلة فارغة حالياً</p>
      </div>

      <hr>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <h4>المجموع الإجمالي: <span id="cartTotal" class="text-success fw-bold">0.00 د.أ</span></h4>
        <div>
          <button onclick="clearCart()" class="btn btn-outline-danger me-2 fw-bold">تفريغ السلة</button>
          <button onclick="checkout()" class="btn btn-warning fw-bold">إتمام الطلب</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', displayCart);

    function displayCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cartItemsContainer');
      const totalEl = document.getElementById('cartTotal');

      if (cart.length === 0) {
        container.innerHTML = '<p class="text-center text-muted my-4">السلة فارغة حالياً</p>';
        totalEl.innerText = '0.00 د.أ';
        return;
      }

      let html = '<ul class="list-group mb-3">';
      let total = 0;

      cart.forEach((item, index) => {
        const itemTotal = (item.price || 0) * (item.quantity || 1);
        total += itemTotal;
        html += `
          <li class="list-group-item d-flex justify-content-between align-items-center py-3">
            <div>
              <h6 class="mb-1 fw-bold">${item.name || 'منتج'}</h6>
              <small class="text-muted">السعر: ${item.price || 0} د.أ × الكمية: ${item.quantity || 1}</small>
            </div>
            <div>
              <span class="fw-bold text-primary me-3">${itemTotal.toFixed(2)} د.أ</span>
              <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">حذف</button>
            </div>
          </li>
        `;
      });

      html += '</ul>';
      container.innerHTML = html;
      totalEl.innerText = total.toFixed(2) + ' د.أ';
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      displayCart();
    }

    function clearCart() {
      if (confirm('هل أنت تأكد من تفريغ كافة المنتجات من السلة؟')) {
        localStorage.removeItem('cart');
        displayCart();
      }
    }

    function checkout() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      
      if (cart.length === 0) {
        alert('السلة فارغة حالياً!');
        return;
      }

      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

      if (!isLoggedIn) {
        alert('يرجى تسجيل الدخول أولاً لإتمام عملية الشراء.');
        localStorage.setItem('redirectAfterLogin', 'cart.html'); 
        window.location.href = 'login.html';
      } else {
        const userName = localStorage.getItem('currentUser') || 'عميلنا العزيز';
        alert(`شكراً لك يا ${userName}! تم إتمام طلبك بنجاح وسنتواصل معك قريباً لتأكيد التوصيل. 🚚✨`);
        
        localStorage.removeItem('cart');
        displayCart();
      }
    }
  </script>

</body>
</html>
