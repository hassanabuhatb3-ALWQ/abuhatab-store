
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - محلات أبو حطب لمواد البناء</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header class="main-header">
    <div class="container d-flex justify-content-between align-items-center px-4">
      <a href="index.html" class="brand-title d-flex align-items-center gap-2">
        <i class="bi bi-tools text-warning"></i>
        <span>محلات أبو حطب لمواد البناء</span>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-bold">الرئيسية</a>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <i class="bi bi-person-circle fs-1 text-warning mb-2 d-block"></i>
        <h4 class="fw-bold m-0">تسجيل الدخول</h4>
      </div>

      <div class="p-4">
        <form id="loginForm">
          <div class="mb-3 text-start">
            <label class="form-label fw-bold text-dark">اسم المستخدم أو البريد الإلكتروني</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
              <input type="text" id="username" class="form-control" placeholder="أدخل اسمك" required>
            </div>
          </div>

          <div class="mb-4 text-start">
            <label class="form-label fw-bold text-dark">كلمة المرور</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-login w-100 mb-2 fs-6">
            <i class="bi bi-box-arrow-in-right me-1"></i> تسجيل الدخول
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();

      if (username) {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', username);

        const redirectUrl = localStorage.getItem('redirectAfterLogin');

        if (redirectUrl) {
          localStorage.removeItem('redirectAfterLogin');
          window.location.href = redirectUrl;
        } else {
          window.location.href = 'index.html';
        }
      }
    });
  </script>

</body>
</html>
